<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FalaWeb - Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <nav>
      <a href="index.html" style="text-decoration: none;"><h1 style="color: white;">FalaWeb</h1></a>
        <a href="login.html" id="auth-link">
          <button id="auth-button">Login</button>
      </a>
    </nav>

  <main>
    <div class="hero-text">
      Transforme voz em texto e texto em voz de maneira simples
    </div>

    <div class="label-container">
      <label for="voice-to-text">Voz para Texto</label>
      <button id="start-voice-to-text-btn" class="blue-button"><i class="fas fa-microphone"></i> Iniciar Gravação</button>
      <textarea id="voice-to-text" placeholder="O texto da sua voz aparecerá aqui..."></textarea>
      <button id="copy-for-vlibras-btn" class="green-button" style="margin-top: 10px;">Copiar Texto e Abrir VLibras</button>
    </div>

    <div class="label-container">
      <label for="text-to-voice">Texto para Voz</label>
      <textarea id="text-to-voice" placeholder="Digite o texto que deseja transformar em voz..."></textarea>
      <select id="voice-select"></select>
      <button class="purple-button"><i class="fas fa-volume-up"></i> Falar Texto</button>
    </div>

  </main>
    <script src="script.js"></script>
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    
    <button id="suggestion-btn" class="floating-suggestion-btn"><i class="fas fa-comment-dots"></i></button>

    <div id="suggestion-modal" class="modal">
      <div class="modal-content">
        <span class="close-btn" id="close-suggestion-modal">&times;</span>
        <div id="modal-logged-in-content" style="display:none;">
          <h2>Envie sua Sugestão</h2>
          <form id="suggestion-form">
            <div>
              <label for="suggestion-name">Nome:</label>
              <input type="text" id="suggestion-name" name="name" readonly>
            </div>
            <div>
              <label for="suggestion-email">Email:</label>
              <input type="email" id="suggestion-email" name="email" readonly>
            </div>
            <div>
              <label for="suggestion-text">Sugestão:</label>
              <textarea id="suggestion-text" name="suggestion" rows="5" required></textarea>
            </div>
            <button type="submit">Enviar Sugestão</button>
          </form>
        </div>
        <div id="modal-logged-out-content" style="display:none;">
          <h2>Sugestão</h2>
          <p>Por favor, <a href="login.html">faça login</a> para enviar uma sugestão.</p>
        </div>
        <div id="modal-message" style="margin-top: 15px;"></div>
      </div>
    </div>
</body>
</html>
