<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <nav>
        <a href="index.html" style="text-decoration: none;"><h1 style="color: white;">FalaWeb</h1></a>
    </nav>

    <div class="login-container">
        <div class="login-modal">
            <h2>Criar Conta</h2>
            <form action="/cadastrar" method="post"> 
                <label for="nome" class="sr-only">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Nome Completo" required>

                <label for="email" class="sr-only">E-mail</label>
                <input type="email" id="email" name="email" placeholder="E-mail" required>

                <label for="senha" class="sr-only">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Senha" required>

                <label for="confirmar-senha" class="sr-only">Confirmar Senha</label>
                <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirmar Senha" required>

                <button type="submit">Cadastrar</button>
            </form>
            <p>Já possui uma conta? <a href="login.html">Faça login aqui</a>.</p>
        </div>
    </div>
</body>
</html>
